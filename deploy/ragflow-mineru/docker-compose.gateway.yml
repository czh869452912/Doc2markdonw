services:
  gateway:
    image: ${GATEWAY_IMAGE:-nginx:1.27-alpine}
    container_name: ragflow-mineru-gateway
    profiles:
      - gateway
    restart: unless-stopped
    ports:
      - ${PUBLIC_PORT:-18080}:80
    environment:
      RAGFLOW_WEB_UPSTREAM: ${RAGFLOW_WEB_UPSTREAM:-ragflow-gpu:80}
      GATEWAY_MAX_BODY_SIZE: ${GATEWAY_MAX_BODY_SIZE:-1024m}
      GATEWAY_PROXY_READ_TIMEOUT: ${GATEWAY_PROXY_READ_TIMEOUT:-3600s}
    volumes:
      - ./gateway/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      - ragflow
    depends_on:
      - md-convert-api
      - mineru-router

  ragflow-cpu:
    ports: []

  ragflow-gpu:
    ports: []

  mineru-router:
    ports: []

  mineru-gradio:
    ports: []

  md-convert-api:
    ports: []

  es01:
    ports: []

  opensearch01:
    ports: []

  infinity:
    ports: []

  oceanbase:
    ports: []

  seekdb:
    ports: []

  mysql:
    ports: []

  minio:
    ports: []

  redis:
    ports: []

  nats:
    ports: []

  tei-cpu:
    ports: []

  tei-gpu:
    ports: []

  kibana:
    ports: []
